[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "graphify-diff"
version = "0.2.1"
description = "Incremental graph updates from git diffs — patch a Graphify knowledge graph without re-extracting the entire codebase"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Toshon Jennings" },
]
keywords = ["knowledge-graph", "git", "diff", "code-analysis", "static-analysis", "graph", "graphify"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "networkx>=3.0",
    "rich>=13.0",
    "click>=8.0",
]

[project.scripts]
gdiff = "graphify_diff.cli:main"
graphify-diff = "graphify_diff.cli:main"

[project.urls]
Homepage = "https://github.com/toshon-jennings/graphify-diff"
Repository = "https://github.com/toshon-jennings/graphify-diff"
Issues = "https://github.com/toshon-jennings/graphify-diff/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/graphify_diff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
